# The house's gallery index (Tyto ADR 0162). `tyto gallery list --index <this repository>`
# reads this file at the default branch; each entry's `latest` is the tag install pins and
# update moves to. How an entry is added or bumped: CONTRIBUTING.md.
version: 1
entries:
  - id: tabela
    kind: template
    name: Table
    description: A table in one 1080×1350 image, a title over the whole table, sized so every row fits.
    source: { git: https://github.com/rafaelsilvalor/tyto-template-tabela.git }
    latest: v1.2.0
    templates: [tabela]
    configurations: [roxo]
    preview: previews/tabela.png
    engine: '>=0.14'
    changes: Accepts the house seal (selo) on the grid format.

  - id: agenda-semana
    kind: template
    name: Weekly agenda
    description: The week's classes as a carousel — a cover on the first slide, several disciplines to a slide.
    source: { git: https://github.com/rafaelsilvalor/tyto-template-agenda-semana.git }
    latest: v1.1.0
    templates: [agenda-semana]
    preview: previews/agenda-semana.png
    engine: '>=0.11'
    changes: Moves onto Tyto core 0.34, which centres the footer signature by its ink.

  - id: aprovados
    kind: template
    name: Approved list
    description: An exam's approved list as a carousel — the exam's name on the first slide, the approved grouped by specialty.
    source: { git: https://github.com/rafaelsilvalor/tyto-template-aprovados.git }
    latest: v1.1.0
    templates: [aprovados]
    preview: previews/aprovados.png
    engine: '>=0.11'
    changes: Moves onto Tyto core 0.34, which centres the footer signature by its ink.

  - id: simulados-semana
    kind: template
    name: Weekly mock exams
    description: The week's mock exams as a carousel and as stories — the title, then each day's schedule and its exams.
    source: { git: https://github.com/rafaelsilvalor/tyto-template-simulados-semana.git }
    latest: v1.0.1
    templates: [simulados-semana]
    configurations: [roxo, ocre, vinho]
    preview: previews/simulados-semana.png
    engine: '>=0.11'
    changes: Moves onto Tyto core 0.34. The art is unchanged; the manifest's version now matches the tag.

  - id: concursos-abertos
    kind: template
    name: Open exams
    description: The week's open exams as a 1080×1350 carousel — a cover, one slide per exam with its facts on a card, and a back cover.
    source: { git: https://github.com/rafaelsilvalor/tyto-template-concursos-abertos.git }
    latest: v0.3.1
    templates: [concursos-abertos]
    preview: previews/concursos-abertos.png
    engine: '>=0.14'
    changes: Accented capitals on a first line are no longer cut out of the PNG (MONGAGUÁ, FUNDAÇÃO).

  - id: questao-estrategica
    kind: template
    name: Exam question
    description: One exam question as a 1080×1350 carousel — a cover naming the exam, the statement with its options, the answer and a sign-off.
    source: { git: https://github.com/rafaelsilvalor/tyto-template-questao-estrategica.git }
    latest: v0.8.0
    templates: [questao-estrategica, questao-engenharia]
    preview: previews/questao-estrategica.png
    engine: '>=0.14.3'
    changes: Draws marks in titulo and fecho set in the frontmatter, with no warning; needs Tyto 0.15.0.

  - id: news-da-semana
    kind: template
    name: News of the week
    description: The week's news as a 1080×1350 carousel — "News da semana" and the logo on the left, each slide's news on the right, a label before each item.
    source: { git: https://github.com/rafaelsilvalor/tyto-template-news-da-semana.git }
    latest: v0.3.0
    templates: [news-da-semana]
    preview: previews/news-da-semana.png
    engine: '>=0.13'
    changes: A news item's label is now what comes before the line's first colon, no bold needed, and briefs written the old way draw the same. A price like R$ 9,8 mil no longer splits across lines.

  - id: voce-conhece
    kind: template
    name: Do you know the difference
    description: A "do you know the difference" carousel at 1080×1350 — a cover with the question, explanation slides with coloured highlights and pictures among the lines, and a sign-off.
    source: { git: https://github.com/rafaelsilvalor/tyto-template-voce-conhece.git }
    latest: v0.6.0
    templates: [voce-conhece]
    preview: previews/voce-conhece.png
    engine: '>=0.14'
    changes: Accepts the house seal (selo) on the grid format.

  - id: banner
    kind: template
    name: Product banner
    description: A product banner — one text over a fixed background, in three sizes.
    source: { git: https://github.com/rafaelsilvalor/tyto-template-banner.git }
    latest: v1.1.0
    templates: [banner]
    configurations: [roxo]
    preview: previews/banner.png
    engine: '>=0.14'
    changes: Reports a missing background image instead of drawing plain paper.

  - id: informativo
    kind: template
    name: Court bulletin
    description: A court bulletin carousel at 1080×1350 — one ruling per slide on a paper card that grows with its words, every section optional, and a back cover.
    source: { git: https://github.com/rafaelsilvalor/tyto-template-informativo.git }
    latest: v0.4.0
    templates: [informativo]
    preview: previews/informativo.png
    engine: '>=0.14'
    changes: The question and the answer pick their size per slide, from 36 to 48 px and from 29 to 36 px, to fill the right of their boxes as far as the card allows; the question's box reaches further right. Briefs written for v0.3.0 draw the same sections.
